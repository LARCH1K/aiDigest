name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aidigest
          POSTGRES_PASSWORD: aidigest
          POSTGRES_DB: aidigest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aidigest -d aidigest_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      AIDIGEST_TEST_DATABASE_URL: postgresql+psycopg://aidigest:aidigest@localhost:5432/aidigest_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock -e . --no-deps
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: images (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        include:
          - image: backend
            context: .
          - image: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: read
      packages: write
    env:
      BACKEND_IMAGE: ghcr.io/larch1k/aidigest-backend
      FRONTEND_IMAGE: ghcr.io/larch1k/aidigest-frontend
    steps:
      - name: Проверить ветку и вычислить тег
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/master
          echo "VERSION=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
      - name: Указать коммит и опубликованный тег в сводке
        shell: bash
        run: |
          printf 'Оба образа опубликованы.\n\n- Полный SHA коммита: %s\n- Тег для .env: AIDIGEST_VERSION=%s\n' \
            "$GITHUB_SHA" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
