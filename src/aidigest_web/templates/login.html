{% extends "base.html" %}
{% set hide_nav = true %}
{% block title %}Вход{% endblock %}
{% block content %}
<section class="login">
  <div class="card login-card">
    <h1>Вход</h1>
    <p class="muted">Сайт с кейсами внедрения ИИ. Пароль выдаёт команда, которая его запустила.</p>
    <form method="post">
      <label class="field">
        <span>Пароль</span>
        <input type="password" name="password" autofocus required autocomplete="current-password">
      </label>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <button class="btn btn-primary btn-block" type="submit">Войти</button>
    </form>
  </div>
</section>
{% endblock %}
