[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidigest"
version = "0.1.0"
description = "Пайплайн сбора кейсов внедрения ИИ"
requires-python = ">=3.12"
dependencies = [
    "openai",
    "pydantic>=2",
    "pyyaml",
    "openpyxl",
    "tavily-python",
    "requests",
    "trafilatura",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
