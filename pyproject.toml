[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidigest"
version = "0.1.0"
description = "Пайплайн сбора кейсов внедрения ИИ"
requires-python = ">=3.12"
dependencies = [
    "openai",
    "pydantic>=2",
    "pyyaml",
    "openpyxl",
    "tavily-python",
    "requests",
    "trafilatura",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.2",
    "alembic",
]

[project.optional-dependencies]
dev = ["pytest"]
api = ["fastapi", "uvicorn", "itsdangerous", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
markers = ["pg: тест ходит в Postgres (AIDIGEST_TEST_DATABASE_URL)"]
testpaths = ["tests"]
