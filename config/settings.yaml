# Настройки регулярного цикла
run_budget: 30            # кредитов Tavily на обычный запуск
first_run_budget: 100     # кредитов на первый запуск (пустая база) — решение пользователя
confirm_share: 0.4        # доля бюджета, зарезервированная под подтверждение
freshness_days: 30        # окно свежести материалов
max_results: 5            # результатов на поисковый запрос сбора
confirm_max_results: 5    # результатов на поиск подтверждения
article_max_chars: 12000  # сколько символов статьи отдавать LLM
recheck_after_days: 28    # повтор подтверждения кейсов «один_источник» не чаще
max_rechecks: 2           # не более повторов на кейс
llm_model: GigaChat-3-Pro # если в litellm.env нет LITELLM_MODEL
monthly_limit: 1000      # кредитов Tavily в месяц по тарифу (учёт — data/credits.json)
monthly_warn_share: 0.8  # предупреждать, когда потрачено больше этой доли
