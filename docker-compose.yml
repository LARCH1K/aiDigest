# Переменные задаются в .env (пример в .env.example).
x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *common
    image: postgres:17
    environment:
      POSTGRES_USER: aidigest
      POSTGRES_DB: aidigest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - ${AIDIGEST_DATA_HOST:-/srv/aidigest/data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "aidigest", "-d", "aidigest"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    <<: *common
    image: ghcr.io/larch1k/aidigest-backend:${AIDIGEST_VERSION:?задайте AIDIGEST_VERSION в .env}
    build: .
    user: "${AIDIGEST_UID:-1000}:${AIDIGEST_GID:-1000}"
    init: true
    environment:
      DATABASE_URL: postgresql+psycopg://aidigest:${POSTGRES_PASSWORD}@db:5432/aidigest
      AIDIGEST_SECURE_COOKIE: "${AIDIGEST_SECURE_COOKIE:-0}"
      AIDIGEST_TRUST_REAL_IP: "1"
      AIDIGEST_SEARCH_PROVIDER: "${AIDIGEST_SEARCH_PROVIDER:-yandex}"
    volumes:
      - ${AIDIGEST_DATA_HOST:-/srv/aidigest/data}/backend:/data
    env_file:
      - path: ${AIDIGEST_SECRETS:-/srv/aidigest/secrets}/secrets.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    <<: *common
    image: ghcr.io/larch1k/aidigest-frontend:${AIDIGEST_VERSION:?задайте AIDIGEST_VERSION в .env}
    build: ./frontend
    ports:
      - "${AIDIGEST_HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
